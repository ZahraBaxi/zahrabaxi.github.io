<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    body {
      background-color: #fff6ec;
      font-family: Futura, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      /* padding: 2rem; */
    }

    h1 {
      font-size: 3rem;
      color: #79904d;
      /* margin-bottom: 0.5rem; */
    }

    p {
      color: #222;
      font-size: 1.2rem;
      max-width: 600px;
    }

    .home-link {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #79904d;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .home-link:hover {
      background: #5a7035;
    }

    .bunny {
      max-width: 8rem;
      font-size: 3.5rem;
      transform: rotate(9deg)
      /* margin-bottom: 1rem; */
    }
  </style>
</head>
<body>
  <img src ="images/bunny.png" class="bunny">
  <!-- <div class="bunny">🐇</div> -->
  <h1>404 — Page Not Found</h1>
  <p>Looks like this page wandered off trail. Let’s help you hop back to safety.</p>
  <a href="index.html" class="home-link">Go to Homepage</a>
</body>
</html>
