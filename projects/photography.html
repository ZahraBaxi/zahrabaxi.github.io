        <!-- BUG REPORT MODAL -->
    <div class="modal-overlay" id="bug-modal-overlay">
        <div class="modal">
            <button class="modal-close" id="bug-modal-close" aria-label="Close">✕</button>
            <h2 class="modal-title">🐛 report a bug</h2>
            <p class="modal-subtitle">spotted something broken, wrong, or inaccessible? let me know and i'll fix it!</p>
            <div id="bug-form-area">
                <div class="form-row">
                    <label for="bug-page">where did you see it?</label>
                    <input type="text" id="bug-page" placeholder="e.g. about page, lit review project...">
                </div>
                <div class="form-row">
                    <label for="bug-description">what happened?</label>
                    <textarea id="bug-description" rows="4" placeholder="describe the bug, what you saw, what you expected..."></textarea>
                </div>
                <div class="form-row">
                    <label for="bug-email">your email <span style="opacity:0.5;">(optional, if you want a reply)</span></label>
                    <input type="email" id="bug-email" placeholder="your@email.com" autocomplete="email">
                </div>
                <button class="form-submit" id="bug-submit">submit report ↗</button>
                <p class="form-status" id="bug-status"></p>

                <p>thank you for helping me make my website a better place!</p>
            </div>
        </div>
    </div>
