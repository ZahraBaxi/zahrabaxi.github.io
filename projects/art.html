    <style>
        .artwork-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2em 1.5em;
            align-items: start;
        }
        .artwork {
            margin: 0;
        }
        .artwork img {
            display: block;
            width: 100%;
            height: auto;
        }
        /* masonry: the script adds this class, then sets how many small rows each piece spans */
        .artwork-grid.is-masonry {
            grid-auto-rows: 8px;
            grid-auto-flow: row dense;
            row-gap: 0;
        }
        .artwork-grid.is-masonry .artwork {
            padding-bottom: 2em;
        }
        .artwork figcaption {
            display: flex;
            flex-direction: column;
            gap: 0.15em;
            margin-top: 0.6em;
        }
        .artwork-title {
            font-family: "montreal medium", "montreal", sans-serif;
        }
        .artwork-meta {
            font-size: 0.88em;
            opacity: 0.75;
        }

        .artwork-open {
            display: block;
            width: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: zoom-in;
        }
        .artwork-open:focus-visible {
            outline: 3px solid var(--accentblue, #1F18FF);
            outline-offset: 3px;
        }

        /* larger view */
        .art-viewer {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            background: rgba(245, 242, 232, 0.97);
            color: var(--blackish, #06042d);
        }
        .art-viewer[open] {
            display: flex;
        }
        .art-viewer-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8em;
            width: 100%;
            padding: 3.5em 1em 1em;
            box-sizing: border-box;
        }
        .art-viewer-img {
            display: block;
            max-width: 92vw;
            max-height: 74vh;
            object-fit: contain;
        }
        .art-viewer-caption {
            display: flex;
            flex-direction: column;
            gap: 0.15em;
            text-align: center;
        }
        .art-viewer-title {
            font-family: "montreal medium", "montreal", sans-serif;
        }
        .art-viewer-meta {
            font-size: 0.88em;
            opacity: 0.85;
        }
        .art-viewer-nav {
            display: flex;
            gap: 1em;
        }
        .art-viewer button.art-viewer-btn {
            font-family: "montreal medium", "montreal", sans-serif;
            font-size: 0.88em;
            color: inherit;
            background: transparent;
            border: 1px solid currentColor;
            border-radius: 2em;
            padding: 0.4em 1.1em;
            cursor: pointer;
        }
        .art-viewer button.art-viewer-btn:hover {
            background: rgba(6, 4, 45, 0.08);
        }
        .art-viewer button.art-viewer-btn:focus-visible {
            outline: 3px solid var(--accentblue, #1F18FF);
            outline-offset: 2px;
        }
        .art-viewer-close {
            position: absolute;
            top: 1em;
            right: 1em;
        }
        @media screen and (max-width: 900px) {
            .artwork-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media screen and (max-width: 600px) {
            .artwork-grid { grid-template-columns: 1fr; }
        }
    </style>

<script>
(function () {
    var figures = Array.prototype.slice.call(document.querySelectorAll('.artwork'));
    var viewer = document.querySelector('.art-viewer');
    if (!viewer || !figures.length) return;

    var viewerImg = viewer.querySelector('.art-viewer-img');
    var viewerTitle = viewer.querySelector('.art-viewer-title');
    var viewerMeta = viewer.querySelector('.art-viewer-meta');
    var closeBtn = viewer.querySelector('.art-viewer-close');
    var prevBtn = viewer.querySelector('.art-viewer-prev');
    var nextBtn = viewer.querySelector('.art-viewer-next');
    var current = 0;
    var opener = null;

    function show(index) {
        current = (index + figures.length) % figures.length;
        var fig = figures[current];
        var img = fig.querySelector('img');
        viewerImg.src = img.getAttribute('data-full') || img.getAttribute('src');
        viewerImg.alt = img.getAttribute('alt') || '';
        viewerTitle.textContent = fig.querySelector('.artwork-title').textContent;
        viewerMeta.textContent = fig.querySelector('.artwork-meta').textContent;
    }

    function openViewer(index, button) {
        opener = button;
        show(index);
        viewer.showModal();
        document.body.style.overflow = 'hidden';
    }

    figures.forEach(function (fig, i) {
        var button = fig.querySelector('.artwork-open');
        if (!button) {
            var img = fig.querySelector('img');
            button = document.createElement('button');
            button.type = 'button';
            button.className = 'artwork-open';
            img.parentNode.insertBefore(button, img);
            button.appendChild(img);
        }
        var title = fig.querySelector('.artwork-title').textContent;
        button.setAttribute('aria-label', 'view larger: ' + title);
        button.addEventListener('click', function () { openViewer(i, button); });
    });

    closeBtn.addEventListener('click', function () { viewer.close(); });
    prevBtn.addEventListener('click', function () { show(current - 1); });
    nextBtn.addEventListener('click', function () { show(current + 1); });

    // clicking the dark area around the image closes the viewer
    viewer.addEventListener('click', function (e) {
        if (e.target === viewer || e.target.classList.contains('art-viewer-inner')) {
            viewer.close();
        }
    });

    viewer.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { show(current - 1); }
        if (e.key === 'ArrowRight') { show(current + 1); }
    });

    // Escape and the close button both end up here
    viewer.addEventListener('close', function () {
        document.body.style.overflow = '';
        if (opener) { opener.focus(); }
    });
})();
</script>

<script>
(function () {
    var grid = document.querySelector('.artwork-grid');
    if (!grid) return;
    var figures = Array.prototype.slice.call(grid.querySelectorAll('.artwork'));
    var rowHeight = 8;

    grid.classList.add('is-masonry');

    function layout() {
        figures.forEach(function (fig) {
            var height = fig.getBoundingClientRect().height;
            fig.style.gridRowEnd = 'span ' + Math.ceil(height / rowHeight);
        });
    }

    layout();
    window.addEventListener('load', layout);
    window.addEventListener('resize', layout);

    figures.forEach(function (fig) {
        var img = fig.querySelector('img');
        if (img) { img.addEventListener('load', layout); }
    });

    if (window.ResizeObserver) {
        var observer = new ResizeObserver(layout);
        figures.forEach(function (fig) { observer.observe(fig); });
    }
})();
</script>
